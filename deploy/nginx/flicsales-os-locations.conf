# FlicSales OS (__AMB__): o que todo endereço (principal, <slug>.<DOMINIO_BASE>, domínio próprio) serve.
# Incluído em cada bloco 443 (ou no server da porta própria, no modo IP) pelo deploy/certificados.sh, que troca as
# marcas: AMB = ambiente; API/WEB = portas internas da API e do Next (só 127.0.0.1, nada fica exposto direto);
# XFH = $host (domínio) ou $http_host (modo IP: o Host leva a porta e o BFF compara com o Origin);
# HSTS = cabeçalho HSTS (só com HTTPS; no modo IP vira comentário).
#
# O navegador só fala com o Next: páginas e /bff/* (o BFF guarda os tokens em cookies httpOnly e chama a API por
# INTERNAL_API_URL). A organização sai do endereço: o nginx repassa Host/X-Forwarded-Host e o BFF repassa à API.
client_max_body_size 12m;   # uploads (UPLOAD_MAX_MB=10) + margem

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
__HSTS__
server_tokens off;

# Login e recuperação de senha (pelo BFF): limite apertado por IP (a API tem o seu próprio limite além deste)
location ~ ^/bff/auth/(login|forgot|reset|forgot-codigo|reset-codigo|primeiro-acesso)$ {
    limit_req zone=flicsalesos___AMB___auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # sobrescreve: o cliente não forja o próprio IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host __XFH__;
}

# BFF: todas as chamadas de dados do navegador. A IA pode levar alguns segundos: timeout maior.
location /bff/ {
    limit_req zone=flicsalesos___AMB___geral burst=60 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host __XFH__;
    proxy_read_timeout 120s;
}

# Partes da API expostas direto (autenticação própria ou públicas por natureza): health, webhooks de integrações e
# link assinado de arquivo. O resto da API só é alcançável pelo BFF (127.0.0.1).
location ~ ^/api/(health|webhooks|arquivos-publicos)(/|$) {
    limit_req zone=flicsalesos___AMB___geral burst=40 nodelay;
    proxy_pass http://127.0.0.1:__API__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host __XFH__;
}
location /api/ {
    return 404;
}

# Estáticos do Next (nome com hash: cache longo)
location /_next/static/ {
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    __HSTS__
}

location / {
    limit_req zone=flicsalesos___AMB___geral burst=60 nodelay;
    proxy_pass http://127.0.0.1:__WEB__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host __XFH__;
}
