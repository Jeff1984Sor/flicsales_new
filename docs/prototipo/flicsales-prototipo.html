<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlicSales • Orquestração inteligente</title><style>

content:space-between;font-size:11px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;font-size:10px;letter-spacing:.6px;color:var(--muted);font-weight:500;padding:14px 10px;border-bottom:1px solid var(--line)}td{padding:17px 10px;border-bottom:1px solid var(--line)}tbody tr:hover{background:#0A84FF08;cursor:pointer}.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.column{background:#0A84FF08;border-radius:9px;padding:14px;min-height:350px}.column h3{font-size:12px;display:flex;justify-content:space-between}.deal{background:white;border:1px solid var(--line);border-radius:8px;padding:16px;margin-top:14px;cursor:pointer;box-shadow:0 3px 5px #00000003}.deal strong{display:block;margin:12px 0}.deal p{font-size:11px;color:var(--muted)}.bar{height:8px;background:#0A84FF08;border-radius:6px;margin:12px 0 20px}.bar i{height:100%;background:var(--green);display:block;border-radius:6px}.banner{font-size:11px;background:#A8B0BD20;padding:8px 12px;border-radius:6px;color:#596579;margin-bottom:22px}.drawer{position:fixed;right:0;top:73px;bottom:0;background:#fff;width:470px;box-shadow:-10px 0 50px #24201b20;z-index:8;padding:26px;overflow:auto;display:none}.drawer.open{display:block}.drawer h2{font-size:23px}.drawer label,form label{display:block;font-size:12px;margin:17px 0 7px}input,select,textarea{width:100%;border:1px solid var(--line);padding:11px;border-radius:6px;background:white;color:var(--ink)}textarea{min-height:85px;resize:vertical}.answer{background:#0A84FF0A;padding:18px;border-radius:9px;margin:20px 0;font-size:13px}.answer p{margin-bottom:12px}.source{border-left:2px solid #00D1C1;padding-left:12px;font-size:11px;color:var(--muted);margin:17px 0}.chatquestion{padding:12px;background:#0A84FF0D;border-radius:7px;margin-top:15px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--brown);color:white;padding:15px 25px;border-radius:9px;z-index:30;display:none}.modulecards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.modulecards .panel{margin:0}details{border-top:1px solid var(--line);padding:15px 0;font-size:12px}summary{cursor:pointer;font-weight:600}details p{padding-top:10px}.steps{display:flex;gap:8px;margin:20px 0;flex-wrap:wrap}.steps span{background:#0A84FF0D;color:var(--green);padding:10px;border-radius:5px;font-size:11px}.chart{display:flex;height:170px;align-items:flex-end;gap:18px;padding:15px 8px 25px}.chart div{flex:1;background:#0A84FF;border-radius:5px 5px 0 0;position:relative}.chart span{position:absolute;bottom:-23px;font-size:10px;width:100%;text-align:center;color:var(--muted)}.check{width:auto}.mobilemenu{display:none}@media(max-width:1100px){header{gap:10px}.search{max-width:180px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:25px}.kanban{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){header{padding:12px;height:auto;flex-wrap:wrap}.logo{width:auto;font-size:22px}.search{display:none}.tabs{order:3;width:100%}.shell{grid-template-columns:1fr}aside{padding:10px}aside small,.asidefoot{display:none}nav{display:flex;overflow:auto;margin:0}nav button{white-space:nowrap;width:auto;font-size:12px;padding:10px}nav button span{display:none}main{padding:20px 14px}.pagehead{align-items:flex-start;flex-direction:column}.insight{flex-wrap:wrap}.insight button{margin:0}.modulecards{grid-template-columns:1fr}.drawer{top:0;width:min(100%,470px)}.panel{padding:17px}.tablewrap{overflow:auto}.metrics{gap:10px}.metric{padding:15px}.metric strong{font-size:23px}.avatar{margin-left:auto}.kanban{grid-template-columns:1fr 1fr;gap:8px}.column{padding:9px}.deal{padding:10px}}
button.primary{background:#0A84FF;color:#0B1020;border-color:#0A84FF;font-weight:600}button.primary:hover{background:#0057D9;color:#FFFFFF}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #00D1C1;outline-offset:3px}nav button.active span{color:#00D1C1}.insight .spark{color:#0057D9}.logo span{color:#0A84FF}aside{position:sticky;top:73px;height:calc(100vh - 73px);overflow:auto}.navgroup{display:block;margin:23px 0 8px;font-size:9px!important}nav button{padding:9px 14px;margin:2px 0;font-size:12px}.quickbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#FFFFFF;padding:14px;border:1px solid #A8B0BD55;border-radius:9px;margin-bottom:22px}.quickbar button{font-size:11px;padding:8px 10px}@media(max-width:760px){aside{position:static;height:auto}nav .navgroup{display:none}nav{display:flex}nav button{flex-shrink:0}} </style><header><div class="logo">flic<span>sales</span><sup style="font-size:9px;margin-left:5px;color:#A8B0BD">/ OS</sup></div><div class="tabs" id="tabs"></div><input class="search" id="search" placeholder="Buscar empresas, negócios…" aria-label="Busca global"><button onclick="openAI('Toda a FlicSales')">✧ IA unificada</button><div class="avatar">FA</div></header><div class="shell"><aside><small id="modlabel"></small><nav id="nav"></nav><div class="asidefoot">Um contexto. Próxima ação.<br><span style="color:#00D1C1">●</span> Ambiente de demonstração<br><button class="ghost" onclick="go('Arquitetura e escopo')">↗ Arquitetura e escopo</button></div></aside><main id="main"></main></div><section id="drawer" class="drawer" aria-label="Painel contextual"></section><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let mod='Comercial',page='Hoje';const menus={Comercial:['Hoje','Oportunidades','Atividades','Comunicações','Desempenho','Dashboards','Assistente'],Financeiro:['Hoje','A receber','A pagar','Recorrências','Caixa','Dashboards','Assistente'],Núcleo:['Cadastros mestres','Campos personalizados','Automações','Integrações','Administração','Assistente']};let deals=[{id:1,name:'Projeto de consultoria',company:'Aurora Consultoria',value:24000,stage:'Negociação',owner:'Marina',interest:'Alto'},{id:2,name:'Expansão de operação',company:'Vértice Serviços',value:18000,stage:'Proposta',owner:'Lucas',interest:'Alto'},{id:3,name:'Diagnóstico estratégico',company:'Horizonte Gestão',value:12000,stage:'Discovery',owner:'Marina',interest:'Médio'},{id:4,name:'Consultoria recorrente',company:'Atlas Tecnologia',value:9600,stage:'Entrada',owner:'Lucas',interest:'Médio'}];let bills=[{company:'Ponto Norte',desc:'Consultoria • parcela 1/2',value:6000,date:'05/11/2026',status:'Vencido'},{company:'Estúdio Base',desc:'Mensalidade • novembro',value:4800,date:'12/11/2026',status:'Aberto'},{company:'Lume Serviços',desc:'Implantação • parcela única',value:8500,date:'18/11/2026',status:'Aberto'}];let tasks=['Confirmar escopo com Aurora','Retomar proposta da Vértice','Preparar discovery da Horizonte'];let custom=['Interesse · Lista · Oportunidade','Origem · Lista · Empresa'];let companies=['Aurora Consultoria','Vértice Serviços','Horizonte Gestão','Atlas Tecnologia'];const money=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const btn=(t,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${t}</button>`;const metric=(label,value,sub)=>`<div class="metric"><span class="muted">${label}</span><strong>${value}</strong><small>${sub}</small></div>`;const tag=(t,c='')=>`<span class="tag ${c}">${t}</span>`;
function notify(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}function closeD(){$('#drawer').classList.remove('open')}function drawer(html){$('#drawer').innerHTML=`<div class="panelhead"><span class="eyebrow">FLICSALES / CONTEXTO</span>${btn('✕','closeD()')}</div>`+html;$('#drawer').classList.add('open')}function switchMod(m){mod=m;page=menus[m][0];render()}function go(p){page=p;render()}function heading(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="muted">${desc}</p></div><div class="row">${btn('✧ Perguntar à IA',"openAI('Este módulo')")}${action}</div></div>`}function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
function render(){$('#tabs').innerHTML=Object.keys(menus).map(m=>btn(m,`switchMod('${m}')`,m===mod?'active':'')).join('');$('#modlabel').textContent='WORKSPACE / '+mod.toUpperCase();$('#nav').innerHTML=menus[mod].map((p,i)=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${(['◈','▥','◷','≋','◉','▦','◈','✧'][i]||'✧')}</span>${p}</button>`).join('');let content=page==='Arquitetura e escopo'?architecture():page==='Hoje'?home():page==='Oportunidades'?pipeline():page==='Atividades'?activities():page==='Comunicações'?communications():page==='Desempenho'?performance():page==='Dashboards'?dashboard():page==='Assistente'?assistant():['A receber','A pagar'].includes(page)?finance():page==='Recorrências'?recurrences():page==='Caixa'?cash():page==='Cadastros mestres'?masters():page==='Campos personalizados'?fields():page==='Automações'?automation():page==='Integrações'?integrations():admin();$('#main').innerHTML=`<div class="crumb">Workspace &nbsp; / &nbsp; ${mod} &nbsp; / &nbsp; ${page}<span style="float:right">07 novembro 2026</span></div><div class="banner">MOCKUP INTERATIVO · Dados fictícios · IA e integrações simuladas · Alterações nesta sessão</div>`+content;}
function home(){let fin=mod==='Financeiro';return heading('Seu dia, em perspectiva.',fin?'O que entra, o que sai e o que precisa de uma decisão.':'Boa tarde, Francine. Seu próximo movimento começa aqui.',btn(fin?'Novo lançamento':'+ Oportunidade',fin?'newBill()':'newDeal()','primary'))+`<div class="insight"><div class="spark">✧</div><div><div class="eyebrow">LEITURA DO MOMENTO</div><p><strong>${fin?'Uma cobrança precisa de atenção.':'Uma conversa pode destravar sua semana.'}</strong></p><p class="muted">${fin?'Ponto Norte tem R$ 6.000 vencidos. Prepare um lembrete e revise antes do envio.':'Aurora aguarda confirmação de escopo. A negociação representa R$ 24 mil em receita potencial.'}</p></div>${btn('Entender e agir',fin?"openAI('Este módulo')":"detail(1)")}</div><div class="metrics">${fin?metric('A receber em novembro','R$ 19.300','3 títulos da demonstração')+metric('Valores vencidos','R$ 6.000','1 título requer atenção')+metric('A pagar no mês','R$ 7.200','2 obrigações previstas')+metric('Saldo informado','R$ 25.000','Atualizado em 07/11'):metric('Pipeline aberto',money(deals.filter(d=>d.stage!=='Ganha').reduce((s,d)=>s+d.value,0)),deals.filter(d=>d.stage!=='Ganha').length+' oportunidades ativas')+metric('Em negociação','R$ 24.000','Confirmar escopo e próximo passo')+metric('Tarefas do dia',tasks.length,'Prioridades com responsável')+metric('Recebíveis vinculados',bills.filter(b=>b.origin).length,'Vendas ≠ recebimentos')}</div><div class="grid"><div><div class="panel"><div class="panelhead"><h2>O que merece sua atenção</h2>${tag('Próximas ações','green')}</div>${tasks.map((t,i)=>`<div class="task"><div class="dot"></div><div><strong>${t}</strong><p>${['Marina · Hoje, 16h · Negociação','Lucas · Hoje, 17h · Proposta','Marina · Segunda, 10h · Discovery'][i%3]}</p></div>${btn('Concluir',`completeTask(${i})`)}</div>`).join('')||'<p>Tudo em dia.</p>'}</div><div class="panel"><div class="panelhead"><h2>Do negócio ao recebimento</h2>${btn('Explorar fluxo',"go('Oportunidades')")}</div><div class="steps"><span>Oportunidade</span><span>Condição comercial</span><span>Recebível em rascunho</span><span>Recebimento</span></div><p class="muted">Dados reaproveitados. Cada transição mantém origem, responsável e histórico.</p></div></div><div><div class="panel"><h2>Agenda conectada</h2>${tag('Prévia • sem conexão real')}<div class="timeline"><time>14:00</time><div><strong>Revisão comercial</strong><p>Equipe · 30 minutos</p></div></div><div class="timeline"><time>16:00</time><div><strong>Alinhamento com Aurora</strong><p>Marina · Confirmação pendente</p></div></div>${btn('Ver atividades',"switchMod('Comercial');go('Atividades')")}</div><div class="panel"><h2>Saúde da operação</h2><p>Comercial → Financeiro</p><div class="pipeline"><div style="flex:4"></div><div style="flex:3;background:#0A84FF"></div><div style="flex:2;background:#0057D9"></div><div style="flex:1;background:#0B1020"></div></div><div class="legend"><span>Entrada</span><span>Discovery</span><span>Proposta</span><span>Fechamento</span></div><p class="muted" style="margin-top:23px">Veja evidências antes de decidir.</p>${btn('Analisar operação',"openAI('Toda a FlicSales')")}</div></div></div>`}
function completeTask(i){tasks.splice(i,1);render();notify('Atividade concluída na demonstração')}
function pipeline(){return heading('Oportunidades','Um funil simples. Contexto completo em cada negociação.',btn('+ Oportunidade','newDeal()','primary'))+`<div class="row" style="margin-bottom:22px">${tag('Funil de serviços B2B','green')}${tag('Todas as pessoas')}${tag('Valores únicos • BRL')}<span class="muted" style="margin-left:auto">Clique em um negócio para explorar</span></div><div class="kanban">${['Entrada','Discovery','Proposta','Negociação'].map(s=>`<div class="column"><h3>${s}<span>${deals.filter(d=>d.stage===s).length}</span></h3>${deals.filter(d=>d.stage===s).map(d=>`<article class="deal" onclick="detail(${d.id})">${tag(d.interest+' interesse',d.interest==='Alto'?'green':'')}<strong>${d.name}</strong><p>${d.company}</p><h3 style="margin-top:20px">${money(d.value)}</h3><p>◷ Próxima ação · ${d.owner}</p></article>`).join('')}</div>`).join('')}</div>${deals.some(d=>d.stage==='Ganha')?`<div class="panel" style="margin-top:20px"><h2>Ganhos nesta sessão</h2>${deals.filter(d=>d.stage==='Ganha').map(d=>`<p>${d.company} · ${money(d.value)} ${btn('Ver origem',`detail(${d.id})`)}</p>`).join('')}</div>`:''}`}
function detail(id){let d=deals.find(x=>x.id===id);drawer(`<div class="eyebrow">OPORTUNIDADE / ${d.stage.toUpperCase()}</div><h2 style="margin-top:12px">${d.name}</h2><p class="muted">${d.company} · ${d.owner}</p><div class="metrics" style="grid-template-columns:1fr 1fr">${metric('Valor único',money(d.value),'Receita potencial')}${metric('Interesse',d.interest,'Campo personalizado')}</div><label>Etapa</label><select onchange="moveDeal(${id},this.value)">${['Entrada','Discovery','Proposta','Negociação','Ganha'].map(s=>`<option ${s===d.stage?'selected':''}>${s}</option>`).join('')}</select><div class="answer"><h3>✧ Contexto da negociação</h3><p>Aurora pediu confirmação do escopo antes de aprovar a proposta. Próximo passo sugerido: alinhar entregáveis com o decisor.</p><div class="source">Fonte demonstrativa: notas da reunião · 06/11/2026, 14h<br>Hipótese de fechamento; sem probabilidade preditiva.</div></div><div class="row">${btn('✧ Analisar registro',"openAI('Este registro')")}${d.stage!=='Ganha'?btn('Marcar como ganha',`winForm(${id})`,'primary'):tag('Venda ganha • revisar financeiro','green')}</div><h3 style="margin-top:25px">Histórico compartilhado</h3><p class="muted">06/11 · Reunião vinculada<br>05/11 · Proposta registrada<br>03/11 · Discovery concluído</p>`)}function moveDeal(id,s){if(s==='Ganha'){winForm(id);return}deals.find(d=>d.id===id).stage=s;render();detail(id)}
function newDeal(){drawer(`<h2>Nova oportunidade</h2><p class="muted">Comece com o essencial. Enriqueça no momento certo.</p><form onsubmit="event.preventDefault();saveDeal(this)"><label>Título *</label><input name="title" required placeholder="Ex.: Consultoria de expansão"><label>Empresa</label><input name="company" list="companies" placeholder="Selecionar ou criar"><datalist id="companies">${companies.map(c=>`<option>${c}</option>`).join('')}</datalist><label>Valor único estimado (R$)</label><input name="value" type="number" min="0" step="0.01"><label>Interesse · personalizado</label><select name="interest"><option>Médio</option><option>Alto</option><option>Baixo</option></select><p class="muted">Entrada e responsável são preenchidos automaticamente.</p><button class="primary" style="margin-top:20px">Criar oportunidade</button></form>`)}function saveDeal(f){let company=f.company.value.trim()||'Empresa a definir';if(company!=='Empresa a definir'&&!companies.includes(company))companies.push(company);deals.push({id:Date.now(),name:f.elements.title.value.trim(),company,value:Number(f.value.value),stage:'Entrada',owner:'Francine',interest:f.interest.value});closeD();go('Oportunidades');notify('Oportunidade criada; cadastro compartilhado atualizado')}
function winForm(id){let d=deals.find(x=>x.id===id);drawer(`<h2>Revisar fechamento</h2><p>${d.company} · ${d.name}</p><form onsubmit="event.preventDefault();confirmWin(${id},this)"><label>Empresa *</label><input name="company" value="${d.company}" required><label>Valor único acordado (R$) *</label><input name="value" type="number" min="0.01" step="0.01" value="${d.value}" required><label>Condição comercial</label><select name="condition"><option>Parcela única</option><option>2 parcelas iguais</option></select><label>Primeiro vencimento *</label><input name="due" type="date" value="2026-11-20" required><div class="answer">O fechamento prepara recebíveis em rascunho. Ele não registra pagamento nem movimenta o caixa.</div><button class="primary">Confirmar venda e preparar recebíveis</button></form>`)}function confirmWin(id,f){let d=deals.find(x=>x.id===id);if(d.stage==='Ganha'){notify('Esta venda já foi processada');return}d.company=f.company.value;d.value=Number(f.value.value);d.stage='Ganha';let n=f.condition.selectedIndex===1?2:1;for(let i=0;i<n;i++){let dt=new Date(f.due.value+'T12:00:00');dt.setMonth(dt.getMonth()+i);bills.push({company:d.company,desc:d.name+` • ${i+1}/${n}`,value:d.value/n,date:dt.toLocaleDateString('pt-BR'),status:'Rascunho',origin:id})}closeD();mod='Financeiro';go('A receber');notify('Venda ganha. Revise os recebíveis antes de confirmar.')}
function finance(){let pay=page==='A pagar';let list=pay?[{company:'Espaço Compartilhado',desc:'Aluguel',value:4200,date:'10/11/2026',status:'Aberto'},{company:'Nuvem Digital',desc:'Serviços de tecnologia',value:3000,date:'15/11/2026',status:'Aberto'}]:bills;return heading(page,pay?'Obrigações previstas, responsáveis e vencimentos.':'Recebíveis conectados às vendas, com histórico de origem.',btn('+ Lançamento','newBill()','primary'))+`<div class="panel">${table(['EMPRESA / DESCRIÇÃO','VALOR','VENCIMENTO','STATUS','AÇÃO'],list.map((b,i)=>`<tr><td><strong>${b.company}</strong><p class="muted">${b.desc}</p></td><td>${money(b.value)}</td><td>${b.date}</td><td>${tag(b.status,b.status==='Vencido'?'amber':'green')}</td><td>${pay?btn('Ver detalhes',"openAI('Este registro')"):btn(b.status==='Rascunho'?'Revisar':b.status==='Recebido'?'Ver histórico':'Registrar recebimento',`billDetail(${i})`)}</td></tr>`))}</div><p class="muted">Baixas são gerenciais. Nenhuma operação bancária é executada.</p>`}
function billDetail(i){let b=bills[i];drawer(`<h2>${b.status==='Rascunho'?'Revisar recebível':'Detalhe do título'}</h2><p>${b.company} · ${b.desc}</p><div class="answer"><strong>${money(b.value)}</strong><p>Vencimento: ${b.date}<br>Status: ${b.status}</p><p>${b.origin?'Origem: oportunidade ganha #'+b.origin:'Origem: lançamento demonstrativo'}</p></div>${b.status==='Rascunho'?btn('Confirmar recebível',`bills[${i}].status='Aberto';closeD();render();notify('Recebível confirmado, sem baixa financeira')`,'primary'):b.status==='Recebido'?'<p>Baixa demonstrativa registrada nesta sessão.</p>':`<form onsubmit="event.preventDefault();receive(${i},this)"><label>Valor recebido *</label><input name="amount" type="number" min="0.01" max="${b.value}" step="0.01" value="${b.value}" required><label>Data efetiva *</label><input type="date" required value="2026-11-07"><label>Conta *</label><select required><option>Conta operacional</option></select><button class="primary" style="margin-top:20px">Confirmar baixa gerencial</button></form>`}`)}function receive(i,f){let b=bills[i],a=Number(f.amount.value);if(a===b.value)b.status='Recebido';else{b.value-=a;b.status='Parcial'}closeD();render();notify('Baixa registrada na demonstração; saldo atualizado')}
function newBill(){drawer(`<h2>Novo lançamento</h2><form onsubmit="event.preventDefault();bills.push({company:this.company.value,desc:this.desc.value,value:Number(this.value.value),date:new Date(this.due.value+'T12:00:00').toLocaleDateString('pt-BR'),status:'Aberto'});closeD();go('A receber');notify('Lançamento gerencial criado')"><label>Empresa *</label><input name="company" required><label>Descrição *</label><input name="desc" required><label>Valor *</label><input name="value" type="number" min="0.01" step="0.01" required><label>Vencimento *</label><input name="due" type="date" required><button class="primary" style="margin-top:20px">Salvar</button></form>`)}
function activities(){return heading('Atividades','Uma próxima ação visível para cada relacionamento.',btn('+ Atividade',"createTask()",'primary'))+`<div class="panel">${tasks.map((t,i)=>`<div class="task"><div class="dot"></div><div><strong>${t}</strong><p>Responsável · Hoje · Pendente</p></div>${btn('Concluir',`completeTask(${i})`)}</div>`).join('')}</div><div class="panel"><h2>Agenda e sincronização</h2><p>Google Calendar e Outlook terão conexão autorizada no produto. Este mockup apresenta apenas a experiência.</p>${btn('Ver integrações',"switchMod('Núcleo');go('Integrações')")}</div>`}function createTask(){drawer(`<h2>Nova atividade</h2><form onsubmit="event.preventDefault();tasks.push(this.elements.title.value);closeD();render();notify('Atividade criada')"><label>Título *</label><input name="title" required><label>Vencimento *</label><input type="date" required><button class="primary" style="margin-top:20px">Salvar atividade</button></form>`)}
function communications(){return heading('Comunicações','Reuniões, e-mails e mensagens com contexto de negócio.',btn('+ Importar conteúdo','importComm()','primary'))+`<div class="grid"><div class="panel"><h2>Conversas vinculadas</h2>${[['Reunião','Discovery · Aurora','06/11 · Notas fornecidas'],['E-mail','Proposta · Vértice','05/11 · Exemplo de mensagem'],['WhatsApp','Próximo encontro · Horizonte','04/11 · Texto fornecido']].map(a=>`<div class="task"><div><span class="tag">${a[0]}</span><h3 style="margin:12px 0 6px">${a[1]}</h3><p>${a[2]}</p></div>${btn('Analisar',`analyzeComm('${a[0]}')`)}</div>`).join('')}</div><div class="panel"><span class="eyebrow">ANÁLISE COM EVIDÊNCIAS</span><h2 style="margin-top:16px">Da conversa à ação.</h2><p class="muted">Objetivo, necessidades declaradas, objeções e compromissos. Respostas e tarefas ficam em revisão.</p><div class="source">Canais desconectados. Nenhuma conta pessoal é acessada. Os exemplos são fictícios.</div>${btn('Analisar exemplo',"analyzeComm('Reunião')")}</div></div>`}function analyzeComm(channel){drawer(`<h2>Análise de ${channel}</h2>${tag('Exemplo pré-configurado','amber')}<div class="answer"><h3>Necessidade declarada</h3><p>Centralizar o acompanhamento das negociações e reduzir o retrabalho no financeiro.</p><h3>Objeção</h3><p>O cliente precisa validar o escopo antes da aprovação.</p><h3>Compromisso identificado</h3><p>Marina enviará o detalhamento do projeto até 09/11.</p><div class="source">Fonte: notas fictícias de discovery, 06/11.<br>“Precisamos confirmar os entregáveis antes de aprovar.”<br>Não há transcrição ou análise de emoções.</div></div>${btn('Criar tarefa sugerida',"tasks.push('Enviar detalhamento de escopo · Aurora · 09/11');notify('Tarefa criada após sua revisão')",'primary')}${btn('Preparar resposta',"prepareReply()")}`)}function prepareReply(){drawer(`<h2>Resposta em rascunho</h2><textarea>Olá! Conforme conversamos, vou detalhar os entregáveis e o escopo para validarmos juntos antes da aprovação. Podemos revisar na segunda-feira?</textarea><p class="muted">Rascunho demonstrativo. Nenhum envio disponível neste mockup.</p>${btn('Usar como próxima atividade',"tasks.push('Revisar e enviar resposta à Aurora');notify('Atividade criada')",'primary')}`)}function importComm(){drawer(`<h2>Importar comunicação</h2><label>Canal</label><select><option>Notas de reunião</option><option>E-mail</option><option>WhatsApp</option></select><label>Conteúdo fornecido</label><textarea id="commtext" placeholder="Cole notas ou uma mensagem autorizada"></textarea><p class="muted">Nesta demonstração, o texto não é enviado a um modelo. A análise exibida será um exemplo fixo.</p>${btn('Ver exemplo de análise',"analyzeComm('conteúdo fornecido')",'primary')}`)}
function performance(){return heading('Desempenho da equipe','Indicadores verificáveis para orientar o desenvolvimento.')+`<div class="row" style="margin-bottom:20px"><select aria-label="Período" style="width:auto" onchange="notify('Amostra demonstrativa fixa: outubro de 2026')"><option>Outubro de 2026</option><option>Período demonstrativo</option></select>${tag('24 oportunidades encerradas')}${tag('Carteira de serviços B2B')}</div><div class="metrics">${metric('Conversão','33,3%','8 ganhas / 24 encerradas')}${metric('Receita ganha','R$ 160 mil','Valores únicos · outubro')}${metric('Ticket médio','R$ 20 mil','R$ 160 mil / 8 vendas')}${metric('Ciclo mediano','68 dias','8 oportunidades ganhas')}</div><div class="panel">${table(['VENDEDOR','GANHAS / ENCERRADAS','CONVERSÃO','RECEITA GANHA','SEM PRÓXIMA AÇÃO','ANÁLISE'],[['Marina','5 / 14','35,7%','R$ 100.000','2'],['Lucas','3 / 10','30,0%','R$ 60.000','3']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}<td>${btn('Ver evidências',`performanceDetail('${r[0]}')`)}</td></tr>`))}</div><div class="panel"><h2>Critérios transparentes</h2><p class="muted">Amostra fictícia independente do funil da sessão. Sem ranking, nota única ou inferência de personalidade. Comparações exigem carteiras e períodos equivalentes.</p><details><summary>Fórmulas e limites</summary><p>Conversão = ganhas ÷ (ganhas + perdidas). Ticket = receita única ganha ÷ quantidade de vendas. Ciclo = mediana dos dias da criação ao ganho. Precisão do forecast: sem base histórica suficiente nesta amostra.</p></details></div>`}function performanceDetail(name){drawer(`<h2>Desenvolvimento · ${name}</h2><p class="muted">Outubro de 2026 · Amostra ilustrativa</p><div class="answer"><h3>Gargalo observado</h3><p>Negócios sem próxima ação podem perder continuidade. Isso indica uma lacuna no registro; não prova ausência de contato com o cliente.</p><h3>Ação sugerida</h3><p>Revisar semanalmente as oportunidades abertas e registrar responsável, prazo e próximo passo.</p><div class="source">Fontes: oportunidades e atividades fictícias. Análise de qualidade de comunicação exige conteúdo autorizado.</div></div>${btn('Criar ação de desenvolvimento',`tasks.push('Revisar próximas ações com ${name}');notify('Ação de desenvolvimento registrada')`,'primary')}`)}
function dashboard(){return heading('Dashboards','Sua visão de gestão, com campos padrão e personalizados.',btn('+ Configurar indicador','widget()','primary'))+`<div class="metrics">${metric('Pipeline · alto interesse',money(deals.filter(d=>d.interest==='Alto'&&d.stage!=='Ganha').reduce((s,d)=>s+d.value,0)),'Filtro por campo personalizado')}${metric('Oportunidades',deals.length,'Registros da sessão')}${metric('Recebíveis',bills.length,'Registros gerenciais')}${metric('Próximas ações',tasks.length,'Atividades pendentes')}</div><div class="grid"><div class="panel"><h2>Pipeline por etapa</h2><div class="chart">${['Entrada','Discovery','Proposta','Negociação'].map((s,i)=>`<div style="height:${Math.max(8,deals.filter(d=>d.stage===s).reduce((a,d)=>a+d.value,0)/300)}px"><span>${s}</span></div>`).join('')}</div><p class="muted">Valores únicos abertos. O funil não compõe o saldo de caixa.</p></div><div class="panel"><h2>Personalização compartilhada</h2><p>Campos personalizados podem ser usados nos filtros, indicadores e condições dos fluxos.</p><details><summary>Definição do indicador de interesse</summary><p>Soma de valor único das oportunidades abertas em que Interesse = Alto. Exclui ganhos. Dados atualizados nesta sessão.</p></details>${btn('Ver campos',"switchMod('Núcleo');go('Campos personalizados')")}</div></div>`}function widget(){drawer(`<h2>Configurar indicador</h2><label>Nome</label><input value="Pipeline por interesse"><label>Objeto</label><select><option>Oportunidades</option></select><label>Métrica</label><select><option>Soma do valor único</option><option>Quantidade</option></select><label>Filtro de campo personalizado</label><select id="filterInterest"><option>Alto</option><option>Médio</option><option>Baixo</option></select>${btn('Calcular prévia',"previewWidget()",'primary')}<div id="widgetResult" class="answer">Escolha o filtro e calcule.</div><p class="muted">Configuração de layout ilustrativa; cálculo usa os registros da sessão.</p>`)}function previewWidget(){let v=$('#filterInterest').value;$('#widgetResult').textContent='Pipeline aberto · Interesse '+v+': '+money(deals.filter(d=>d.interest===v&&d.stage!=='Ganha').reduce((s,d)=>s+d.value,0))}
function assistant(){return heading('Uma conversa. Todos os contextos.','Os assistentes especializados trabalham juntos dentro das suas permissões.')+`<div class="panel" style="max-width:850px;margin:35px auto;text-align:center;padding:45px"><div style="font-size:44px;color:var(--green)">✧</div><h1 style="margin-top:18px">O que você precisa decidir?</h1><p class="muted">Conecte evidências, entenda impactos e prepare a próxima ação.</p><div class="row" style="justify-content:center;margin-top:25px">${btn('Analisar este módulo',"openAI('Este módulo')")}${btn('Relacionar vendas e caixa',"openAI('Toda a FlicSales')")}${btn('Priorizar minha semana',"openAI('Este módulo')")}</div><div class="source" style="text-align:left;margin-top:30px">Mockup: respostas pré-configuradas e dados fictícios. O produto usará uma camada de IA compartilhada, com ferramentas e contexto específicos por função.</div></div>`}
function openAI(scope){drawer(`<div class="eyebrow">ASSISTENTE DE ORQUESTRAÇÃO</div><h2 style="margin-top:12px">Vamos conectar os pontos.</h2><label>Escopo da conversa</label><select id="scope">${['Este registro','Este módulo','Toda a FlicSales'].map(s=>`<option ${s===scope?'selected':''}>${s}</option>`).join('')}</select><p class="muted">Contexto: ${mod} / ${page}</p><div class="chatquestion">${scope==='Toda a FlicSales'?'Quais negociações podem afetar os recebimentos?':'O que precisa de atenção neste contexto?'}</div><div id="aiAnswer" class="answer">${aiText(scope)}</div><details><summary>Assistentes e fontes consultadas</summary><p>Oportunidades, atividades e financeiro: dados demonstrativos. Comunicações: exemplo de notas. Fontes externas: desconectadas. Período: novembro de 2026. Cada ferramenta terá acesso limitado às permissões do usuário.</p></details><label>Sua pergunta</label><textarea id="question" placeholder="Ex.: Por que esta negociação está parada?"></textarea>${btn('Ver resposta demonstrativa',"askAI()",'primary')}<p class="muted" style="font-size:11px">Nenhum modelo de IA é chamado neste protótipo.</p>`)}function aiText(scope){return `<h3>${scope==='Toda a FlicSales'?'Impacto entre áreas':'Prioridade do contexto'}</h3><p>Aurora tem R$ 24.000 em negociação e uma validação de escopo pendente. Esse valor é potencial comercial; ainda não é recebível nem saldo de caixa.</p><h3>Próxima ação sugerida</h3><p>Confirmar os entregáveis e a condição de pagamento. Se houver aceite, preparar os títulos para revisão do financeiro.</p><div class="source">Evidência: oportunidade Aurora + notas fictícias de 06/11.<br>Limite: não existe compromisso confirmado de fechamento.<br>Resposta pré-configurada para demonstrar o formato.</div>${btn('Criar tarefa após revisão',"tasks.push('Validar entregáveis e pagamento · Aurora');notify('Tarefa sugerida criada')")}`};function askAI(){let q=$('#question').value.trim();if(!q){notify('Digite uma pergunta');return}$('#aiAnswer').innerHTML=`<p class="muted">Pergunta recebida apenas na demonstração.</p>`+aiText($('#scope').value);notify('Exemplo fixo de resposta; sem análise real da pergunta')}
function masters(){return heading('Cadastros mestres','Uma base única para Comercial e Financeiro.',btn('+ Empresa','newCompany()','primary'))+`<div class="panel"><div class="row" style="margin-bottom:20px">${tag('Empresas','green')}${btn('Pessoas',"masterType('Pessoas')")}${btn('Produtos e serviços',"masterType('Produtos e serviços')")}</div>${table(['EMPRESA','PAPÉIS','ORIGEM','AÇÃO'],companies.map(c=>`<tr><td><strong>${c}</strong></td><td>${tag('Prospect / Cliente')}</td><td>Cadastro compartilhado</td><td>${btn('Ver cadastro',`companyDetail('${c}')`)}</td></tr>`))}</div>`}function newCompany(){drawer(`<h2>Nova empresa</h2><p class="muted">O nome basta para começar.</p><form onsubmit="event.preventDefault();companies.push(this.elements.name.value.trim());closeD();render();notify('Empresa disponível em todos os módulos')"><label>Nome *</label><input name="name" required><label>CNPJ · opcional</label><input><label>Segmento · opcional</label><input><button class="primary" style="margin-top:20px">Salvar cadastro</button></form>`)}function companyDetail(c){drawer(`<h2>${c}</h2><p class="muted">Registro único do Núcleo</p><div class="answer"><h3>Relacionamentos</h3><p>${deals.filter(d=>d.company===c).length} oportunidade(s)<br>${bills.filter(b=>b.company===c).length} recebível(is)</p></div>${btn('Analisar cadastro',"openAI('Este registro')")}`)}function masterType(t){drawer(`<h2>${t}</h2><p class="muted">Estrutura proposta de cadastro compartilhado.</p>${t==='Pessoas'?'<label>Nome *</label><input placeholder="Nome da pessoa"><label>Empresa</label><input placeholder="Vincular empresa existente"><label>E-mail / telefone</label><input placeholder="Opcional ao criar">':'<label>Nome *</label><input placeholder="Nome do serviço"><label>Tipo</label><select><option>Único</option><option>Recorrente</option></select><label>Preço de referência</label><input type="number">'}<p class="muted">Formulário ilustrativo. No mockup, criação persistente na sessão está disponível para empresas e oportunidades.</p>`)}
function fields(){return heading('Campos personalizados','Flexibilidade sem duplicar cadastros nem criar novos sistemas.',btn('+ Campo','newField()','primary'))+`<div class="panel">${table(['CAMPO / TIPO / OBJETO','USOS','DEPENDÊNCIAS'],custom.map(c=>`<tr><td>${c}</td><td>Cadastro · filtro · dashboard · automação</td><td>${btn('Inspecionar',"fieldDeps()")}</td></tr>`))}</div><div class="panel"><h2>Regras recomendadas</h2><p class="muted">Exigir campos por etapa ou ação. Tipos estáveis e validação compartilhada. Antes de arquivar, verificar automações, modelos e dashboards dependentes.</p></div>`}function newField(){drawer(`<h2>Novo campo</h2><form onsubmit="event.preventDefault();custom.push(this.elements.name.value+' · '+this.type.value+' · '+this.obj.value);closeD();render();notify('Campo adicionado ao catálogo demonstrativo')"><label>Nome *</label><input name="name" required><label>Tipo</label><select name="type"><option>Texto</option><option>Número</option><option>Moeda</option><option>Data</option><option>Sim/não</option><option>Lista</option></select><label>Objeto</label><select name="obj"><option>Oportunidade</option><option>Empresa</option><option>Pessoa</option></select><p class="muted">Nesta prévia, novos campos são registrados no catálogo. O campo Interesse já demonstra uso no cadastro, dashboard e fluxo.</p><button class="primary">Criar campo</button></form>`)}function fieldDeps(){drawer(`<h2>Dependências do campo</h2><p>Interesse · Oportunidade</p><div class="answer"><p>Dashboard: Pipeline de alto interesse<br>Automação: próxima ação prioritária<br>Cadastro: nova oportunidade</p></div><p class="muted">Arquivamento no produto dependerá da revisão destes usos.</p>`)}
let flowActive=false;function automation(){return heading('Automações','Eventos, condições e ações em um fluxo revisável.')+`<div class="grid"><div class="panel"><div class="panelhead"><h2>Próxima ação prioritária</h2>${tag(flowActive?'Ativa na sessão':'Rascunho',flowActive?'green':'amber')}</div><div class="steps"><span>1 · Mudança de etapa</span><span>2 · Interesse = Alto</span><span>3 · Criar tarefa</span></div><label>Gatilho</label><select id="flowStage"><option>Proposta</option><option>Negociação</option></select><label style="display:block;margin:18px 0 8px">Condição · campo personalizado</label><select><option>Interesse é igual a Alto</option></select><label style="display:block;margin:18px 0 8px">Ação</label><input value="Criar tarefa: confirmar próximo passo"><div class="row" style="margin-top:22px">${btn('Testar com amostra','testFlow()')}${btn(flowActive?'Pausar':'Ativar na demonstração',"flowActive=!flowActive;render();notify('Estado atualizado apenas nesta sessão')",'primary')}</div><div id="flowResult"></div></div><div class="panel"><h2>Motor único de regras</h2><p class="muted">Comercial e Financeiro usam o mesmo mecanismo, com ações específicas e permissões próprias.</p><details open><summary>Controles de engenharia</summary><p>Identificador de execução, prevenção de duplicidade, retentativas limitadas, histórico e prevenção de ciclos. Envios dependem de conexão autorizada e fluxo previamente ativado.</p></details><p class="muted">A ativação desta prévia não executa tarefas automaticamente.</p></div></div>`}function testFlow(){let stage=$('#flowStage').value;let n=deals.filter(d=>d.stage===stage&&d.interest==='Alto').length;$('#flowResult').innerHTML=`<div class="answer">Teste sem execução: ${n} oportunidade(s) da sessão correspondem a Etapa = ${stage} e Interesse = Alto. Criaria ${n} tarefa(s).</div>`}
function integrations(){return heading('Integrações','Conexões explícitas, capacidades claras e histórico de falhas.')+`<div class="modulecards">${['Google Calendar','Microsoft Outlook','E-mail','WhatsApp'].map(c=>`<div class="panel"><div class="eyebrow">${c.includes('Calendar')||c.includes('Outlook')?'AGENDA':'COMUNICAÇÃO'}</div><h2 style="margin-top:15px">${c}</h2>${tag('Desconectado')}<p class="muted" style="margin:17px 0">${c==='WhatsApp'?'Requer conector oficial autorizado.':c==='E-mail'?'Leitura e envio exigem escopos próprios.':'Eventos e participantes; conteúdo de reunião exige outra fonte.'}</p>${btn('Ver requisitos',`integrationDetail('${c}')`)}</div>`).join('')}</div>`}function integrationDetail(c){drawer(`<h2>${c}</h2><div class="answer"><h3>Antes de conectar no produto</h3><p>Definir conta, escopos de leitura/escrita, responsável, retenção e fluxos dependentes. Permitir testar, reconectar e revogar.</p></div><p class="muted">Conector não implementado neste mockup. Nenhuma autenticação ou captura é realizada.</p>`)}
function recurrences(){return heading('Recorrências','Receita recorrente com início, frequência e encerramento explícitos.')+`<div class="panel">${table(['CLIENTE','VALOR / MÊS','INÍCIO','FIM','PRÓXIMA GERAÇÃO'],['<tr><td>Estúdio Base</td><td>R$ 4.800</td><td>12/09/2026</td><td>12/08/2027</td><td>12/12/2026</td></tr>'])}<div class="answer">Exemplo de regra: gerar um título por competência, sem duplicar. Alterações futuras preservam parcelas liquidadas.</div>${btn('Entender recorrência',"openAI('Este registro')")}</div>`}function cash(){return heading('Caixa','Saldo informado e projeção gerencial, separados do pipeline.')+`<div class="metrics">${metric('Saldo informado','R$ 25.000','07/11 · sem conciliação bancária')}${metric('Entradas previstas','R$ 19.300','Amostra base · novembro')}${metric('Saídas previstas','R$ 7.200','Amostra base · novembro')}${metric('Saldo projetado','R$ 37.100','25.000 + 19.300 − 7.200')}</div><div class="panel"><h2>Composição e limites</h2><p>A projeção acima é uma amostra fixa para ilustrar a tela. Novas baixas e lançamentos da sessão ainda não recalculam este gráfico.</p><div class="source">No produto: saldo inicial + movimentos confirmados; projeção inclui somente títulos abertos. Transferências internas não são receita nem despesa. Funil comercial aparece em cenário separado.</div></div>`}function admin(){return heading('Administração','Governança compartilhada, sem um console para cada função.')+`<div class="modulecards">${[['Usuários e perfis','Gestor, comercial e financeiro. Acesso por organização, função e registro.'],['Configuração da IA','Fontes permitidas, critérios, retenção e histórico das ações aprovadas.'],['Categorias e contas','Formas de pagamento, contas gerenciais e categorias financeiras.'],['Auditoria','Autor, horário, versão e origem para mudanças e operações sensíveis.'],['Qualidade dos dados','Sinais de duplicidade e mesclagem revisada, preservando os vínculos.'],['Plano e consumo','Limites de uso, recursos disponíveis e consumo de IA.']].map(([t,d])=>`<div class="panel"><h2>${t}</h2><p class="muted">${d}</p>${btn('Explorar estrutura',"go('Arquitetura e escopo')")}</div>`).join('')}</div>`}
function architecture(){return heading('Arquitetura e escopo','Parecer de CTO · uma base viável para construir e evoluir.')+`<div class="insight"><div class="spark">◈</div><div><div class="eyebrow">DECISÃO DE ARQUITETURA</div><p><strong>Três módulos de produto. Uma plataforma compartilhada.</strong></p><p class="muted">Recomendação inicial: monólito modular, banco relacional e processamento assíncrono. Separar serviços quando escala ou isolamento justificarem.</p></div></div><div class="modulecards">${[['Comercial','Hoje · Oportunidades · Atividades · Comunicações · Desempenho · Dashboards'],['Financeiro','Hoje · A receber · A pagar · Recorrências · Caixa · Dashboards'],['Núcleo','Cadastros · Campos · Automações · Integrações · Administração']].map(([t,d])=>`<div class="panel"><h2>${t}</h2><p class="muted">${d}</p></div>`).join('')}</div><div class="panel" style="margin-top:22px"><h2>O que manter, reajustar e adiar</h2>${table(['DECISÃO','ESTRUTURA','JUSTIFICATIVA'],[['Manter','Cadastro único e criação contextual','Empresa e pessoa são compartilhadas; sem duplicar lead e cliente.'],['Manter','Campos personalizados, dashboards e fluxos','Mesmo catálogo tipado com validação e dependências.'],['Reajustar','Assistentes em todas as funções','Uma camada de IA com ferramentas especializadas, contexto e permissões; sem agente independente por tela.'],['Reajustar','Desempenho e previsões','Indicadores calculados em código; IA interpreta evidências. Previsão estatística exige histórico.'],['Reajustar','Financeiro inicial','Controle gerencial, baixas parciais, estornos e recorrências; sem escopo fiscal ou bancário inicial.'],['Adiar','Captura automática de todos os canais','Começar por notas e mensagens fornecidas; conectar cada canal após validar API, autorização e custo.'],['Adiar','ERP fiscal, Open Finance e comissões complexas','Não são necessários para validar a continuidade da venda ao recebimento.']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`))}</div><div class="grid"><div class="panel"><h2>Camadas técnicas propostas</h2><details open><summary>1. Experiência e domínio</summary><p>Interface única com módulos. APIs de domínio: relacionamentos, oportunidades, atividades, títulos, baixas, recorrências e caixa. Cadastros compartilham identificadores estáveis.</p></details><details open><summary>2. Dados e transações</summary><p>Banco relacional com isolamento por organização. Parcelas e baixas são objetos próprios; dinheiro em decimal ou centavos. Histórico, estornos e idempotência na geração de recebíveis.</p></details><details><summary>3. Eventos e automações</summary><p>Outbox transacional e fila para integrações, análise de conteúdo e fluxos. Execuções rastreáveis, retentativas limitadas e prevenção de ciclos. Regras de negócio ficam no domínio.</p></details><details><summary>4. IA e conectores</summary><p>Gateway de IA com ferramentas autorizadas, contexto do registro, fontes e respostas estruturadas. Assistentes especializados por capacidade. Textos importados são dados, nunca instruções para executar ações.</p></details></div><div class="panel"><h2>Entrega por etapas</h2><details open><summary>Primeira entrega utilizável</summary><p>Cadastro único, funil, atividades, campos personalizados, financeiro básico, dashboards, regras simples e IA contextual sobre conteúdo fornecido. Chat unificado com escopo explícito.</p></details><details open><summary>Integrações progressivas</summary><p>Google Calendar e Outlook, depois provedores de e-mail e WhatsApp conforme disponibilidade e validação. Cada conexão tem escopos, estado e falhas visíveis.</p></details><details open><summary>Evolução com evidência de uso</summary><p>Análises históricas, previsões calibradas, cenários, custos e rentabilidade. Prazo e orçamento dependem da equipe, volume, provedores e critérios de aceite.</p></details></div></div><div class="panel"><h2>Critério de aceite do primeiro produto</h2><p>Criar empresa durante uma oportunidade → registrar próxima ação → fechar venda → revisar recebíveis sem duplicação → confirmar título → registrar recebimento parcial → conferir saldo e histórico. IA explica as evidências e prepara ações; regras financeiras preservam a integridade dos valores.</p><p class="muted">Este mockup valida navegação e decisões de produto. Autenticação, isolamento, auditoria, persistência, IA real e conectores precisam ser implementados e testados no produto.</p></div>`}
$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){let q=e.target.value.toLowerCase();let found=deals.find(d=>(d.company+' '+d.name).toLowerCase().includes(q));if(found&&q)detail(found.id);else notify('Nenhuma oportunidade encontrada nesta amostra')}});render();
// Workspaces funcionais separados, com infraestrutura compartilhada.
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let funnels=[{id:1,name:'Serviços B2B',stages:[{name:'Entrada',prob:10,days:2,required:'Título e responsável'},{name:'Discovery',prob:25,days:7,required:'Empresa, contato e necessidade'},{name:'Proposta',prob:50,days:10,required:'Produtos, valor e condição comercial'},{name:'Negociação',prob:75,days:14,required:'Decisor, previsão e próxima ação'}]}],funnelId=1;deals.forEach(d=>d.funnel=1);
const currentFunnel=()=>funnels.find(f=>f.id===funnelId);
const baseRender=render;render=function(){baseRender();if(page==='Gestão comercial'||page==='Gestão financeira')$('#main').innerHTML=management(page==='Gestão financeira');};
menus.Comercial.splice(menus.Comercial.length-1,0,'Gestão comercial');menus.Financeiro.splice(menus.Financeiro.length-1,0,'Gestão financeira');
pipeline=function(){let f=currentFunnel(),list=deals.filter(d=>d.funnel===funnelId);return heading('Oportunidades','Funis configuráveis, critérios de avanço e próximos passos.',btn('+ Oportunidade','newDeal()','primary'))+`<div class="row" style="margin-bottom:20px"><select aria-label="Funil de vendas" style="width:230px" onchange="funnelId=Number(this.value);render()">${funnels.map(x=>`<option value="${x.id}" ${x.id===funnelId?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${btn('+ Criar funil','newFunnel()')}${btn('Configurar etapas','editFunnel()')}${btn('Campos e processo',"go('Gestão comercial')")}</div><div class="kanban" style="grid-template-columns:repeat(${Math.min(4,f.stages.length)},minmax(190px,1fr));overflow:auto">${f.stages.map(s=>`<div class="column"><h3>${esc(s.name)} <span>${list.filter(d=>d.stage===s.name).length}</span></h3><p class="muted" style="font-size:11px">${s.prob}% · limite de ${s.days} dias</p>${list.filter(d=>d.stage===s.name).map(d=>`<article class="deal" onclick="detail(${d.id})">${tag(esc(d.interest)+' interesse','green')}<strong>${esc(d.name)}</strong><p>${esc(d.company)}</p><h3 style="margin-top:18px">${money(d.value)}</h3><p>${esc(d.owner)} · ${esc(d.nextAction||'Próxima ação a definir')}</p></article>`).join('')}</div>`).join('')}</div><div class="panel" style="margin-top:20px"><h2>Resultados do funil</h2><p>Ganhos: ${list.filter(d=>d.stage==='Ganha').length} · Perdidos: ${list.filter(d=>d.stage==='Perdida').length}</p><p class="muted">Probabilidades são parâmetros configurados, não previsões de IA. Prazos e campos por etapa são critérios propostos; bloqueios avançados serão implementados no produto.</p></div>`};
function newFunnel(){drawer(`<h2>Criar funil de vendas</h2><form onsubmit="event.preventDefault();saveFunnel(this)"><label>Nome do funil *</label><input name="funnelName" required placeholder="Ex.: Novos negócios"><label>Etapas, uma por linha *</label><textarea name="stages" required>Entrada\nQualificação\nDiscovery\nProposta\nNegociação</textarea><p class="muted">Ganha e Perdida são resultados finais. As etapas são exclusivas deste funil.</p><button class="primary">Criar funil</button></form>`)}
function saveFunnel(f){let names=f.elements.stages.value.split('\n').map(x=>x.trim()).filter(Boolean);if(names.length<2||new Set(names).size!==names.length||names.some(n=>['Ganha','Perdida'].includes(n))){notify('Defina pelo menos duas etapas únicas, sem Ganha ou Perdida');return}let id=Date.now();funnels.push({id,name:f.elements.funnelName.value,stages:names.map((name,i)=>({name,prob:Math.round((i+1)*80/names.length),days:7,required:'Título e responsável'}))});funnelId=id;closeD();go('Oportunidades');notify('Funil criado nesta sessão')}
function editFunnel(){let f=currentFunnel();drawer(`<h2>Etapas · ${esc(f.name)}</h2><form onsubmit="event.preventDefault();saveStages(this)">${f.stages.map((s,i)=>`<div class="panel"><h3>${esc(s.name)}</h3><label>Probabilidade configurada (%)</label><input name="prob${i}" type="number" min="0" max="100" value="${s.prob}" required><label>Limite de permanência (dias)</label><input name="days${i}" type="number" min="1" value="${s.days}" required><label>Critérios e campos exigidos</label><input name="req${i}" value="${esc(s.required)}"></div>`).join('')}<button class="primary">Salvar configuração</button></form>`)}function saveStages(form){currentFunnel().stages.forEach((s,i)=>{s.prob=Number(form.elements['prob'+i].value);s.days=Number(form.elements['days'+i].value);s.required=form.elements['req'+i].value});closeD();render();notify('Critérios do funil atualizados')}
newDeal=function(){drawer(`<h2>Nova oportunidade</h2><form onsubmit="event.preventDefault();saveDeal(this)"><label>Título *</label><input name="title" required><label>Funil *</label><select name="funnel">${funnels.map(f=>`<option value="${f.id}" ${f.id===funnelId?'selected':''}>${esc(f.name)}</option>`).join('')}</select><label>Empresa · selecionar ou criar</label><input name="company" list="companyOptions"><datalist id="companyOptions">${companies.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist><label>Responsável *</label><input name="owner" value="Francine" required><label>Contato principal</label><input name="contact"><label>Valor único previsto (R$)</label><input name="value" type="number" min="0" step="0.01"><label>Valor recorrente mensal (R$)</label><input name="mrr" type="number" min="0" step="0.01"><label>Previsão de fechamento</label><input name="closeDate" type="date"><label>Próxima ação</label><input name="nextAction"><label>Prazo da próxima ação</label><input name="nextDate" type="date"><label>Interesse · personalizado</label><select name="interest"><option>Médio</option><option>Alto</option><option>Baixo</option></select><details><summary>Qualificação e estratégia</summary><label>Origem / canal</label><input name="source"><label>Necessidade e impacto</label><textarea name="need"></textarea><label>Decisor e processo de compra</label><input name="decision"><label>Orçamento / concorrente</label><input name="budget"><label>Critério de sucesso</label><input name="success"></details><button class="primary">Salvar oportunidade</button></form>`)};
saveDeal=function(form){let x=Object.fromEntries(new FormData(form)),f= funnels.find(a=>a.id===Number(x.funnel));let company=x.company.trim()||'Empresa a definir';if(x.company&&!companies.includes(company))companies.push(company);deals.push({...x,id:Date.now(),name:x.title,company,value:Number(x.value),mrr:Number(x.mrr),stage:f.stages[0].name,funnel:f.id});funnelId=f.id;closeD();go('Oportunidades');notify('Oportunidade criada no funil selecionado')};
const oldDetail=detail;detail=function(id){oldDetail(id);let d=deals.find(x=>x.id===id),f=funnels.find(x=>x.id===d.funnel)||currentFunnel();let select=$('#drawer select');select.innerHTML=[...f.stages.map(x=>x.name),'Ganha','Perdida'].map(s=>`<option ${s===d.stage?'selected':''}>${esc(s)}</option>`).join('');$('#drawer').insertAdjacentHTML('beforeend',`<div class="panel" style="margin-top:20px"><h3>Gestão da oportunidade</h3><p>Funil: ${esc(f.name)}<br>Contato: ${esc(d.contact||'Não informado')}<br>Recorrência mensal: ${money(d.mrr||0)}<br>Previsão: ${esc(d.closeDate||'Não definida')}<br>Próxima ação: ${esc(d.nextAction||'Não definida')}</p>${btn('Atualizar etapa e próxima ação',`editDeal(${id})`)}</div>`)};
function editDeal(id){let d=deals.find(x=>x.id===id),f=funnels.find(x=>x.id===d.funnel);drawer(`<h2>Atualizar oportunidade</h2><form onsubmit="event.preventDefault();saveDealEdit(${id},this)"><label>Etapa</label><select name="stage">${[...f.stages.map(s=>s.name),'Perdida'].map(s=>`<option ${s===d.stage?'selected':''}>${esc(s)}</option>`).join('')}</select><label>Próxima ação *</label><input name="action" value="${esc(d.nextAction||'')}" required><label>Prazo *</label><input name="due" type="date" required><label>Motivo de perda · obrigatório se perdida</label><input name="reason"><button class="primary">Salvar alterações</button></form>`)}function saveDealEdit(id,f){if(f.elements.stage.value==='Perdida'&&!f.elements.reason.value.trim()){notify('Informe o motivo da perda');return}let d=deals.find(x=>x.id===id);Object.assign(d,{stage:f.elements.stage.value,nextAction:f.elements.action.value,nextDate:f.elements.due.value,lossReason:f.elements.reason.value});closeD();render();notify('Oportunidade atualizada')}
const oldMove=moveDeal;moveDeal=function(id,s){if(s==='Perdida'){editDeal(id);return}oldMove(id,s)};

automation=function(){return heading('Automações','Ambientes separados por área. Gatilhos, permissões e modelos específicos.',btn('+ Automação','autoEditor()','primary'))+`<div class="row" style="margin-bottom:20px">${['Comercial','Financeiro'].map(a=>btn(a,`autoArea='${a}';render()`,a===autoArea?'primary':'')).join('')}<span class="muted">Motor compartilhado · configurações independentes</span></div><div class="row" style="margin-bottom:22px">${['Modelos','Minhas automações','Histórico'].map(t=>btn(t,`autoTab='${t}';render()`,autoTab===t?'active':'')).join('')}</div>${autoTab==='Modelos'?`<div class="modulecards">${templates[autoArea].map((t,i)=>`<div class="panel"><span class="eyebrow">${autoArea.toUpperCase()}</span><h2 style="margin-top:14px">${t[0]}</h2>${tag(t[1])}<p class="muted">${t[4]}</p><p>${t[2]} · ${t[3]}</p>${btn('Usar modelo',`autoEditor(${i})`)}</div>`).join('')}</div>`:autoTab==='Minhas automações'?`<div class="panel">${table(['NOME','GATILHO','AÇÃO','ESTADO','CONTROLES'],automations.filter(a=>a.area===autoArea).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.trigger)}</td><td>${esc(a.action)} / ${esc(a.type)}</td><td>${tag(a.status)}</td><td>${btn('Testar',`testAutomation(${a.id})`)} ${btn(a.status==='Ativa'?'Pausar':'Ativar',`toggleAutomation(${a.id})`)}</td></tr>`))}${automations.filter(a=>a.area===autoArea).length?'':'<p>Nenhuma automação criada nesta área. Comece por um modelo.</p>'}</div>`:`<div class="panel">${runs.filter(r=>r.area===autoArea).map(r=>`<p>${esc(r.name)} · ${esc(r.result)} · Simulação sem envio</p>`).join('')||'<p>Nenhum teste nesta área.</p>'}</div>`}<div class="panel" style="margin-top:22px"><h2>Atividade e envio são ações diferentes</h2><p>“Criar atividade de WhatsApp” agenda o trabalho de uma pessoa. “Enviar mensagem de WhatsApp” usa um conector autorizado. O mesmo vale para e-mail. Reunião cria uma atividade; convite depende de agenda conectada.</p><p class="muted">Neste mockup, ativação e testes são locais à sessão. Nenhuma mensagem, convite ou pagamento é enviado.</p></div>`};
function autoEditor(index){let t=index===undefined?['Nova automação',triggers[autoArea][0],'Criar atividade','Tarefa','']:templates[autoArea][index];drawer(`<h2>Automação ${autoArea.toLowerCase()}</h2><form onsubmit="event.preventDefault();saveAutomation(this)"><label>Nome *</label><input name="autoName" value="${esc(t[0])}" required><label>Gatilho *</label><select name="trigger">${triggers[autoArea].map(x=>`<option ${x===t[1]?'selected':''}>${x}</option>`).join('')}</select>${autoArea==='Comercial'?`<label>Funil</label><select name="funnel"><option value="">Todos os funis</option>${funnels.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select><label>Etapa de destino · quando aplicável</label><input name="stage" value="${index===1?'Proposta':index===3?'Discovery':''}" placeholder="Ex.: Proposta">`:''}<label>Campo monitorado / condição</label><select name="field"><option>Sem condição adicional</option>${autoArea==='Comercial'&&index===4?'<option selected>Interesse</option>':''}${[...new Set(custom.map(c=>c.split(' · ')[0]))].map(c=>`<option>${esc(c)}</option>`).join('')}<option>Saldo em aberto</option><option>Categoria</option></select><label>Operador</label><select name="operator"><option>Igual a</option><option>Diferente de</option><option>Maior que</option><option>Menor que</option><option>Preenchido</option></select><label>Valor esperado</label><input name="expected" value="${autoArea==='Comercial'&&index===4?'Alto':''}" placeholder="Ex.: Alto"><label>Prazo / período (dias)</label><input name="days" type="number" min="0" value="${autoArea==='Comercial'?(index===2?5:2):(index===0?3:index===4?30:2)}"><label>Ação *</label><select name="action" onchange="autoActionHint(this.value)">${actionTypes.map(x=>`<option ${x===t[2]?'selected':''}>${x}</option>`).join('')}</select><label>Tipo da atividade · para criar atividade</label><select name="type">${activityTypes.map(x=>`<option ${x===t[3]?'selected':''}>${x}</option>`).join('')}</select><label>Responsável *</label><input name="owner" value="${autoArea==='Comercial'?'Responsável da oportunidade':'Responsável financeiro'}" required><label>Destinatário · para envio</label><select name="recipient"><option>Contato principal do registro</option><option>Responsável interno</option></select><label>Modelo / instrução *</label><textarea name="content" required>${esc(t[4]||'Preparar próxima ação para {{empresa.nome}}')}</textarea><p class="muted">Variáveis: {{empresa.nome}}, {{contato.nome}}, {{oportunidade.titulo}}, {{titulo.valor}}, {{titulo.vencimento}} e campos personalizados compatíveis com o objeto.</p><div id="autoHint" class="answer">Conexões de e-mail e WhatsApp estão desconectadas. Fluxos com envio podem ser salvos em rascunho, mas não ativados.</div><label><input class="check" type="checkbox" required> Revisar condições antes de executar e impedir duplicação</label><button class="primary">Salvar rascunho</button></form>`)}function autoActionHint(v){$('#autoHint').textContent=v.startsWith('Enviar')?'Envio requer conexão autorizada, destinatário válido, modelo e regras de pausa. Indisponível neste mockup.':'Cria trabalho interno com responsável, prazo, vínculo e tipo. Convites e execução externa permanecem separados.'}
function saveAutomation(f){let x=Object.fromEntries(new FormData(f));automations.push({...x,name:x.autoName,area:autoArea,id:Date.now(),status:'Rascunho'});closeD();autoTab='Minhas automações';render();notify('Automação salva exclusivamente em '+autoArea)}function toggleAutomation(id){let a=automations.find(x=>x.id===id);if(a.action.startsWith('Enviar')){notify('Conecte o canal autorizado antes de ativar envios');return}a.status=a.status==='Ativa'?'Pausada':'Ativa';render();notify('Estado alterado na sessão; sem execução em segundo plano')}
function testAutomation(id){let a=automations.find(x=>x.id===id),list=a.area==='Comercial'?deals.filter(d=>(!a.funnel||d.funnel===Number(a.funnel))&&(!a.stage||d.stage===a.stage)):bills.filter(b=>b.status!=='Recebido');let matches=list;if(a.field==='Interesse'&&a.expected)matches=list.filter(d=>a.operator==='Diferente de'?d.interest!==a.expected:d.interest===a.expected);let result=a.trigger.includes('Sem interação')||a.trigger.includes('Campo personalizado')?'Gatilho temporal/evento requer histórico: amostra insuficiente para confirmar disparo.':`${matches.length} registro(s) no escopo; evento e prazo ainda dependem de ocorrência real.`;runs.push({area:a.area,name:a.name,result});drawer(`<h2>Teste sem execução</h2><p>${esc(a.name)}</p><div class="answer"><p>${esc(result)}</p><p>Ação preparada: ${esc(a.action)} / ${esc(a.type)}.</p><p>Responsável: ${esc(a.owner)}<br>Prazo: ${esc(a.days)} dias</p></div><p class="muted">Prévia de elegibilidade sobre amostra. Não simula histórico inexistente, não cria tarefas e não envia mensagens.</p>`)}

function audit(action,entity){ops.audit.unshift({at:new Date().toLocaleString('pt-BR'),action,entity,actor:'Francine · demonstração'})}function opDate(s){return s?.includes('-')?s.split('-').reverse().join('/'):s||'—'}function isoDate(s){if(!s)return '';return s.includes('/')?s.split('/').reverse().join('-'):s}function opTitle(b){return b.desc||b.name||'Título'}
function optionsFor(f){if(f.type==='deals')return deals.map(d=>({v:String(d.id),t:d.company+' · '+d.name}));if(f.type==='funnels')return funnels.map(d=>({v:String(d.id),t:d.name}));if(f.type==='bills')return bills.map((d,i)=>({v:String(i),t:d.company+' · '+opTitle(d)}));if(['products','categories','centers','accounts'].includes(f.type))return ops[f.type].map(d=>({v:d.name,t:d.name}));return f.options.map(v=>({v,t:v}))}
function control(f,v=''){let name=esc(f.key),req=f.required?'required':'';if(['select','deals','funnels','bills','products','categories','centers','accounts'].includes(f.type))return `<select name="${name}" ${req}><option value="">Selecionar</option>${optionsFor(f).map(o=>`<option value="${esc(o.v)}" ${String(v)===o.v?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`;if(f.type==='textarea')return `<textarea name="${name}" ${req}>${esc(v)}</textarea>`;return `<input name="${name}" type="${['number','signed'].includes(f.type)?'number':f.type}" ${['number','signed'].includes(f.type)?'step="0.01"':''} ${f.type==='number'?'min="0"':''} value="${esc(v)}" ${req}>`}

function transferForm(){drawer(`<h2>Transferência gerencial</h2><form onsubmit="event.preventDefault();saveTransfer(this)">${fieldForm([field('from','Conta de origem','accounts',true),field('to','Conta de destino','accounts',true),field('amount','Valor (R$)','number',true),field('date','Data','date',true),field('notes','Descrição','textarea')],{date:'2026-11-07'})}<p class="muted">Registro entre contas, sem envio de dinheiro. Não altera receita ou despesa.</p><button class="primary">Registrar transferência</button></form>`)}function saveTransfer(f){let d=Object.fromEntries(new FormData(f));d.amount=Number(d.amount);if(d.from===d.to||d.amount<=0){notify('Selecione contas diferentes e valor positivo');return}if(d.date>'2026-11-07'||[d.from,d.to].some(n=>d.date<ops.accounts.find(a=>a.name===n).base)){notify('Data deve respeitar as datas-base das contas e a posição de 07/11/2026');return}ops.transfers.push({...d,id:++opSeq});audit('Transferência registrada',d.from+' → '+d.to);closeD();render();notify('Movimentos internos registrados')}

function generateCycle(id){let r=ops.recurrences.find(x=>x.id===id);if(r.status!=='Ativa'){notify('A recorrência deve estar ativa');return}drawer(`<h2>Gerar competência</h2><p>${esc(r.name)} · ${money(r.value)}</p><form onsubmit="event.preventDefault();saveCycle(${id},this)"><label>Competência *</label><input type="month" name="period" required><button class="primary" style="margin-top:20px">Gerar título em rascunho</button></form>`)}function saveCycle(id,f){let r=ops.recurrences.find(x=>x.id===id),period=f.elements.period.value;if(period<r.start.slice(0,7)||period>r.end.slice(0,7)){notify('Competência fora da vigência');return}let list=r.direction==='A receber'?bills:ops.payables;if(list.some(t=>t.recurrence===id&&t.competence===period)){notify('Título desta competência já existe');return}let startMonth=Number(r.start.slice(0,4))*12+Number(r.start.slice(5,7)),month=Number(period.slice(0,4))*12+Number(period.slice(5,7)),interval=r.frequency==='Mensal'?1:r.frequency==='Trimestral'?3:12;if((month-startMonth)%interval!==0){notify('Competência incompatível com a frequência');return}list.push({company:r.company,desc:r.name,original:r.value,value:r.value,date:period+'-'+String(r.dueDay).padStart(2,'0'),competence:period,recurrence:id,status:'Rascunho',category:r.category,center:r.center});audit('Competência gerada',r.name+' / '+period);closeD();render();notify('Título criado em rascunho, sem duplicar competência')}

function exportCurrent(){let rows=schemas[page]?ops[schemas[page].key]:page==='A receber'?bills:page==='A pagar'?ops.payables:page==='Atividades'?activityRecords:page==='Empresas e clientes'?companies.map(name=>({name})):[];if(!rows.length){notify('Sem registros para exportar');return}let keys=[...new Set(rows.flatMap(Object.keys))],cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';let csv='\uFEFF'+[keys.map(cell).join(';'),...rows.map(r=>keys.map(k=>cell(r[k])).join(';'))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='FlicSales_'+page.replaceAll(' ','_')+'.csv';a.click();URL.revokeObjectURL(a.href);notify('CSV exportado com os registros desta tela')}
